<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOMBASTIC - Movika Accesorios</title>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white text-center py-6 shadow-md">
    <h1 class="text-3xl font-bold tracking-wide">MOVIKA</h1>
    <p class="text-blue-100 text-sm mt-1">Catálogo oficial de productos y accesorios</p>
  </header>

  <!-- Contenido principal -->
  <main class="max-w-6xl mx-auto p-4 flex-grow w-full space-y-8">
    
    <!-- Catálogo de productos -->
    <section>
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 gap-4">
        <h2 class="text-xl font-bold text-gray-800">Catálogo</h2>
        
        <!-- Botones de filtro por categoría -->
        <div id="filtros" class="flex flex-wrap gap-2">
          <button data-categoria="Todos" class="btn-filtro bg-blue-600 text-white font-medium py-1 px-3 rounded text-sm transition-colors">Todos</button>
          <button data-categoria="Joyería" class="btn-filtro bg-gray-200 text-gray-700 hover:bg-gray-300 font-medium py-1 px-3 rounded text-sm transition-colors">Joyería</button>
          <button data-categoria="Accesorios" class="btn-filtro bg-gray-200 text-gray-700 hover:bg-gray-300 font-medium py-1 px-3 rounded text-sm transition-colors">Accesorios</button>
        </div>
      </div>

      <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      </div>
    </section>

    <!-- Sección del Pedido -->
    <section class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Tu Pedido</h2>
      <ul id="lista-pedido" class="divide-y divide-gray-200 mb-4">
        <li class="py-2 text-gray-500 italic">El pedido está vacío</li>
      </ul>
      <div class="flex justify-between items-center border-t pt-4">
        <p class="text-lg font-bold text-gray-800">Total: $<span id="total-pedido">0</span>.00</p>
        <button id="btn-vaciar" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-1 px-3 rounded text-sm transition-colors">
          Vaciar pedido
        </button>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 text-gray-600 text-center py-4 border-t border-gray-300 text-sm">
    <p>Desarrollado por el Equipo BOMBASTIC</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
